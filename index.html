<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
    <title>فضفض لي وروح نام</title>
    <style>
        /* Base visible styles in case CSS variables or complex selectors fail */
        html, body {
            background-color: #0b0f19 !important;
            color: #e5e7eb !important;
            margin: 0;
            padding: 0;
            min-height: 100%;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            display: block; /* Safer than flex if flex container crashes */
            text-align: center;
            -webkit-text-size-adjust: 100%;
        }
        #error-diag {
            display: none;
            background: #7f1d1d;
            color: #fecaca;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            width: 100%;
            word-break: break-all;
            text-align: left;
            direction: ltr;
            border: 2px solid white;
        }
        .container { 
            width: 100%; 
            max-width: 500px; 
            margin: 0 auto;
            visibility: visible !important;
            opacity: 1 !important;
            display: block !important;
        }
        h1 { color: #10b981; margin-top: 20px; font-size: 24px; }
        textarea {
            width: 100%;
            background: #1f2937;
            border: 1px solid #fbbf24;
            border-radius: 12px;
            color: #fff;
            padding: 15px;
            height: 150px;
            margin-bottom: 20px;
            font-size: 16px;
            box-sizing: border-box;
            -webkit-appearance: none;
        }
        button {
            background: #10b981;
            color: #000;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-weight: bold;
            width: 100%;
            font-size: 18px;
            cursor: pointer;
            -webkit-appearance: none;
        }
        button:disabled { opacity: 0.5; }
        #response { display: none; margin-top: 20px; color: #fbbf24; font-weight: bold; padding: 10px; }
        .history { margin-top: 40px; width: 100%; }
        .card { background: #1f2937; padding: 15px; border-radius: 12px; margin-bottom: 10px; border-right: 4px solid #fbbf24; text-align: right; word-wrap: break-word; }
        .timer { font-size: 11px; color: #10b981; margin-top: 5px; }
    </style>
</head>
<body>
    <div id="error-diag"></div>
    <div class="container" id="main-container">
        <h1>فضفض لي وروح نام</h1>
        <textarea id="input" placeholder="وش اللي شاغل بالك؟"></textarea>
        <button id="btn">أرسل الفضفضة</button>
        <div id="response"></div>
        <div class="history" id="history"></div>
    </div>
    
    <!-- Move error handler to top of body to catch script loading errors -->
    <script>
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            var diag = document.getElementById("error-diag");
            if (diag) {
                diag.style.display = "block";
                diag.innerHTML = "JS Error: " + msg + "<br>Loc: " + lineNo + ":" + columnNo + "<br>URL: " + url;
            }
            return false;
        };
    </script>
    <script src="script.js?v=2"></script>
</body>
</html>
