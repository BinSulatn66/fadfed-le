<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
    <title>فضفض لي وروح نام</title>
    <!-- Critical Inline Styles to guarantee visibility even if JS fails -->
    <style>
        html, body {
            background-color: #0b0f19 !important;
            color: #e5e7eb !important;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            width: 100%;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            display: block;
            text-align: center;
        }
        .container {
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 { color: #10b981; margin-top: 30px; }
        textarea {
            width: 100%;
            background: #1f2937;
            border: 1px solid #fbbf24;
            border-radius: 12px;
            color: #fff;
            padding: 15px;
            height: 150px;
            font-size: 16px;
            box-sizing: border-box;
            -webkit-appearance: none;
        }
        button {
            background: #10b981;
            color: #000;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-weight: bold;
            width: 100%;
            font-size: 18px;
            margin-top: 20px;
            -webkit-appearance: none;
        }
        #error-diag {
            display: none;
            background: #7f1d1d;
            color: #fecaca;
            padding: 15px;
            margin: 20px;
            border-radius: 8px;
            border: 2px solid #fff;
            text-align: left;
            direction: ltr;
        }
    </style>
</head>
<body>
    <div id="error-diag"></div>
    <div class="container">
        <h1>فضفض لي وروح نام</h1>
        <textarea id="input" placeholder="وش اللي شاغل بالك؟"></textarea>
        <button id="btn">أرسل الفضفضة</button>
        <div id="response" style="margin-top:20px; color:#fbbf24; font-weight:bold;"></div>
        <div id="history" style="margin-top:40px;"></div>
    </div>

    <script>
        // High-priority Error Handler
        window.onerror = function(msg, url, line) {
            var d = document.getElementById('error-diag');
            if (d) {
                d.style.display = 'block';
                d.innerHTML = 'Error: ' + msg + ' (Line: ' + line + ')';
            }
            return false;
        };
    </script>
    <script src="script.js?ts=1718000000"></script>
</body>
</html>
